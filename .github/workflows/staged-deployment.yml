name: Deploy DEV & STAGE

permissions:
  contents: write
  pull-requests: write
  actions: read

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

jobs:
  dev-network:
    uses: ./.github/workflows/component-deployment.yml
    with:
      env: dev
      component: network
    secrets: inherit
  
  dev-compute:
    needs: dev-network
    uses: ./.github/workflows/component-deployment.yml
    with:
      env: dev
      component: compute
    secrets: inherit
  
  stage-network:
    needs: dev-compute
    uses: ./.github/workflows/component-deployment.yml
    with:
      env: stage
      component: network
    secrets: inherit
  
  stage-compute:
    needs: stage-network
    uses: ./.github/workflows/component-deployment.yml
    with:
      env: stage
      component: compute
    secrets: inherit
  
  create-pr:
    needs: stage-compute
    runs-on: [ self-hosted ]
    steps:
      - name: Authenticate GH CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.config/gh
          echo "git.ntnu.no:
            user: github-actions[bot]
            oauth_token: ${GH_TOKEN}
            git_protocol: https
          " > ~/.config/gh/hosts.yml

      - name: Verify GH auth
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh auth status -h git.ntnu.no

      - name: Push branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git config --global credential.helper store
          echo "https://x-access-token:${GH_TOKEN}@git.ntnu.no" > ~/.git-credentials

          git fetch origin main
          git checkout -B stage-to-prod
          git push --force --set-upstream origin stage-to-prod

      - name: Create PR for Prod
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --title "Stage → Prod" \
            --body "Promoting stage changes to production" \
            --base main \
            --head stage-to-prod \
            --fill

# This is a basic workflow to help you get started with Actions

name: Simple Terraform CI

permissions:
  contents: write
  actions: write

env:
  OS_APPLICATION_CREDENTIAL_ID: ${{ secrets.OS_APPLICATION_CREDENTIAL_ID }}
  OS_APPLICATION_CREDENTIAL_SECRET: ${{ secrets.OS_APPLICATION_CREDENTIAL_SECRET }}
  OS_AUTH_URL: ${{ secrets.OS_AUTH_URL }}
  TF_HTTP_USERNAME: ${{ secrets.TF_HTTP_USERNAME }}
  TF_HTTP_PASSWORD: ${{ secrets.TF_HTTP_PASSWORD }}
  TFVARS_CONTENT: ${{ secrets.PROD_TFVARS }}

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "github-workflows" ]
  pull_request:
    branches: [ "github-workflows" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  deploy-prod:
    #needs: deploy-staging
    runs-on: [ self-hosted ]
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.10.6

      - name: Create tfvars file
        run: |
          echo "$TFVARS_CONTENT" > terraform.auto.tfvars
          echo "Created tfvars file:"
          ls -l
        working-directory: ./stacks/prod

      - name: OpenTofu Init
        run: tofu init -input=false -no-color -lock=false
        working-directory: ./stacks/prod

      - name: OpenTofu Plan
        run: tofu plan -input=false -no-color -lock=false
        working-directory: ./stacks/prod
      
      - name: OpenTofu Apply
        run: tofu apply -input=false -no-color -lock=false -auto-approve
        working-directory: ./stacks/prod
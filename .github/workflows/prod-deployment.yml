name: Deploy PROD

permissions:
  contents: read
  actions: read

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  manual-approval:
    if: contains(github.event.head_commit.message, 'Merge pull request')
    runs-on: [self-hosted]
    steps:
      - name: Wait for manual approval
        uses: hmarr/auto-approve-action@v2
        
  prod-network:
    needs: manual-approval
    uses: ./.github/workflows/component-deployment.yml
    with:
      env: prod
      component: network
    secrets: inherit
  
  prod-compute:
    needs: prod-network
    uses: ./.github/workflows/component-deployment.yml
    with:
      env: prod
      component: compute
    secrets: inherit
name: Destroy Environment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment to destroy"
        required: true
        type: choice
        options:
          - dev
          - stage
          - prod

permissions:
  contents: read
  actions: read

env:
  OS_APPLICATION_CREDENTIAL_ID: ${{ secrets.OS_APPLICATION_CREDENTIAL_ID }}
  OS_APPLICATION_CREDENTIAL_SECRET: ${{ secrets.OS_APPLICATION_CREDENTIAL_SECRET }}
  OS_AUTH_URL: ${{ secrets.OS_AUTH_URL }}
  TF_HTTP_USERNAME: ${{ secrets.TF_HTTP_USERNAME }}
  TF_HTTP_PASSWORD: ${{ secrets.TF_HTTP_PASSWORD }}

jobs:
  destroy-compute:
    runs-on: [ self-hosted ]
    environment: ${{ github.event.inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.10.6

      - name: Create tfvars file
        run: echo "$TFVARS_CONTENT" > terraform.auto.tfvars
        working-directory: ./stacks/${{ github.event.inputs.environment }}/compute
        env:
          TFVARS_CONTENT: ${{ secrets.TFVARS_CONTENT }}  

      - name: OpenTofu Init
        run: tofu init -input=false -no-color
        working-directory: ./stacks/${{ github.event.inputs.environment }}/compute

      - name: OpenTofu Destroy
        run: tofu destroy -auto-approve -input=false -no-color
        working-directory: ./stacks/${{ github.event.inputs.environment }}/compute

  destroy-network:
    needs: destroy-compute
    runs-on: [ self-hosted ]
    environment: ${{ github.event.inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.10.6

      - name: Create tfvars file
        run: echo "$TFVARS_CONTENT" > terraform.auto.tfvars
        working-directory: ./stacks/${{ github.event.inputs.environment }}/network
        env:
          TFVARS_CONTENT: ${{ secrets.TFVARS_CONTENT }}  

      - name: OpenTofu Init
        run: tofu init -input=false -no-color
        working-directory: ./stacks/${{ github.event.inputs.environment }}/network

      - name: OpenTofu Destroy
        run: tofu destroy -auto-approve -input=false -no-color
        working-directory: ./stacks/${{ github.event.inputs.environment }}/network